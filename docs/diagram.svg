<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a7"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb37f"/>
    </marker>
    <style>
      .t{fill:#e8eaf0;font-size:17px;font-weight:600}
      .s{fill:#a7aec0;font-size:13.5px}
      .l{fill:#8b93a7;font-size:12.5px}
      .box{fill:#1b1f2a;stroke:#2f3646;stroke-width:1.5}
      .hl{fill:#16261f;stroke:#3fb37f;stroke-width:1.5}
      .zone{fill:none;stroke:#3a4152;stroke-width:1.2;stroke-dasharray:6 5}
      .ln{stroke:#8b93a7;stroke-width:1.8;fill:none}
      .lg{stroke:#3fb37f;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#0f1218"/>
  <text x="40" y="48" fill="#e8eaf0" font-size="26" font-weight="700">grok-agent-threads</text>
  <text x="40" y="76" class="s">Your agent reaches your Claude Code chats and Codex threads on your Mac. Nothing is open to the internet.</text>
  <rect x="40" y="130" width="200" height="86" rx="14" class="box"/>
  <text x="62" y="165" class="t">You, on your phone</text>
  <text x="62" y="190" class="s">"message my launch chat:</text>
  <text x="62" y="207" class="s">where are we?"</text>
  <rect x="40" y="270" width="200" height="96" rx="14" class="box"/>
  <text x="62" y="305" class="t">Your agent</text>
  <text x="62" y="330" class="s">Grok Bot, ChatGPT, Codex,</text>
  <text x="62" y="348" class="s">any MCP client (in its cloud)</text>
  <path d="M140 216 V266" class="ln" marker-end="url(#a)"/>
  <rect x="300" y="282" width="150" height="72" rx="36" class="box"/>
  <text x="331" y="314" class="t">Tailscale</text>
  <text x="318" y="336" class="s">your tailnet only</text>
  <path d="M240 318 H296" class="ln" marker-end="url(#a)"/>
  <text x="252" y="306" class="l">MCP</text>
  <rect x="490" y="104" width="680" height="620" rx="18" class="zone"/>
  <text x="510" y="132" class="l">YOUR MAC</text>
  <rect x="510" y="270" width="210" height="96" rx="14" class="hl"/>
  <text x="532" y="303" class="t">grok-agent-threads</text>
  <text x="532" y="327" class="s">MCP server, 127.0.0.1</text>
  <text x="532" y="345" class="s">shared by tailscale serve</text>
  <path d="M450 318 H506" class="ln" marker-end="url(#a)"/>
  <rect x="800" y="150" width="350" height="78" rx="14" class="box"/>
  <text x="822" y="181" class="t">Open chat → its local inbox</text>
  <text x="822" y="205" class="s">answers in place, live in the Claude app</text>
  <rect x="800" y="252" width="350" height="98" rx="14" class="box"/>
  <text x="822" y="283" class="t">Closed or new chat → relay chat</text>
  <text x="822" y="307" class="s">one chat inside the app asks the app to run it:</text>
  <text x="822" y="325" class="s">live on screen, your view stays put</text>
  <rect x="800" y="374" width="350" height="78" rx="14" class="box"/>
  <text x="822" y="405" class="t">No relay → Claude Agent SDK</text>
  <text x="822" y="429" class="s">runs in the background, same chat and settings</text>
  <rect x="800" y="476" width="350" height="78" rx="14" class="box"/>
  <text x="822" y="507" class="t">Codex → codex app-server</text>
  <text x="822" y="531" class="s">list, read, message and start threads</text>
  <path d="M720 300 C760 300 760 189 796 189" class="ln" marker-end="url(#a)"/>
  <path d="M720 312 C760 312 760 301 796 301" class="ln" marker-end="url(#a)"/>
  <path d="M720 326 C760 326 760 413 796 413" class="ln" marker-end="url(#a)"/>
  <path d="M720 340 C760 340 760 515 796 515" class="ln" marker-end="url(#a)"/>
  <rect x="510" y="400" width="210" height="96" rx="14" class="box"/>
  <text x="532" y="433" class="t">Reads</text>
  <text x="532" y="457" class="s">sidebar titles, groups, status;</text>
  <text x="532" y="475" class="s">transcripts; full-text search</text>
  <path d="M615 366 V396" class="ln" marker-end="url(#a)"/>
  <rect x="510" y="590" width="640" height="96" rx="14" class="hl"/>
  <text x="532" y="623" class="t">Live watch page</text>
  <text x="532" y="647" class="s">A private link per chat streams its messages and steps as they happen, whichever lane runs it.</text>
  <text x="532" y="667" class="s">Open it on your phone or Mac, anywhere on your tailnet.</text>
  <path d="M506 640 C300 640 140 600 140 370" class="lg" marker-end="url(#g)"/>
  <text x="250" y="626" fill="#3fb37f" font-size="12.5">watch link</text>
</svg>
